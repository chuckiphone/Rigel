name: release

# This workflow publishes the signed Windows release. The unsigned macOS and Linux bundles are
# configured to build and validate in the ci.yml bundle matrix; publishing them waits on signing and notarisation.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  # A tag is pushed together with the branch it names, so CI for the tagged commit is usually still
  # running when this workflow starts. The gate waits for it rather than trusting the tag name: a
  # release is the one thing that must never happen for a commit the checks have not cleared. A run
  # that fails ends the gate immediately, before twenty minutes of building a doomed installer, and
  # a pass does not end it while a sibling run for the same commit is still going.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 150 * 60 ))
          while :; do
            # Every run of the ci workflow for this exact commit, from any ref. A tag push starts
            # its own run beside the branch one, and both have to clear.
            runs=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
              --jq '.workflow_runs[] | [.status, .conclusion, .html_url] | @tsv' || true)

            failed=$(printf '%s\n' "$runs" | awk -F'\t' '
              $1 == "completed" && ($2 == "failure" || $2 == "timed_out" ||
                $2 == "startup_failure" || $2 == "action_required") { print $3 }')
            passed=$(printf '%s\n' "$runs" | awk -F'\t' '
              $1 == "completed" && $2 == "success" { n++ } END { print n + 0 }')

            if [ -n "$failed" ]; then
              echo "::error::CI failed for $SHA, so this tag will not publish."
              printf 'failing run: %s\n' "$failed"
              exit 1
            fi
            # A success alone is not enough. The branch run and the tag run overlap, and the
            # branch one can pass while the tag one is still queued; exiting here would let the
            # installer build for a commit whose other run later fails. Every matching run has to
            # finish, none may have failed, and at least one must have succeeded.
            unfinished=$(printf '%s\n' "$runs" | awk -F'\t' '
              NF == 0 { next } $1 != "completed" { n++ } END { print n + 0 }')

            if [ "$unfinished" -eq 0 ] && [ "$passed" -gt 0 ]; then
              echo "CI passed for $SHA."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::CI did not clear $SHA within 150 minutes ($unfinished run(s) still unfinished)."
              exit 1
            fi
            echo "Waiting for CI on $SHA ($unfinished run(s) still unfinished)..."
            sleep 20
          done

  windows:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Verify update release wiring
        run: node scripts/check-update-pipeline.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build the pinned Chat sidecar
        run: python scripts/sidecar/build-agentchat.py

      # Release Windows also builds its sidecar from source; it must not inherit a stale binary
      # left in crates/rigel-app/binaries.
      - name: Build the Rigel b sidecar
        run: node scripts/build-rigel-b.mjs --target x86_64-pc-windows-msvc

      - name: Require the Windows sidecar
        run: node scripts/check-platform-targets.mjs --require-sidecar windows-x64

      # The tag is the version the binary reports. Cargo.toml and tauri.conf.json are patched in
      # the runner only; the repository keeps its development version.
      - name: Stamp the release version
        run: node scripts/set-release-version.mjs "${{ github.ref_name }}"

      - name: Build the MSI and NSIS installers
        working-directory: crates/rigel-app
        run: cargo tauri build

      - name: Verify installer branding and pointer
        run: node scripts/check-installer-branding.mjs --dist

      - name: Generate the SBOM
        run: node scripts/make-sbom.mjs sbom.cdx.json

      - name: Sign the update manifest and publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RIGEL_UPDATE_SIGNING_KEY: ${{ secrets.RIGEL_UPDATE_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:RIGEL_UPDATE_SIGNING_KEY) {
            throw "The RIGEL_UPDATE_SIGNING_KEY repository secret is not set."
          }

          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $notes = "docs/release-notes/$version.md"
          # Release notes live under docs/release-notes/ and use links such as `../sso.md`. GitHub's
          # release page resolves those from the wrong base, so publish a temporary copy whose
          # relative doc links point at the tagged repository instead of editing the source note.
          $publishedNotes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          if (Test-Path $notes) {
            node scripts/release-notes-body.mjs $notes $tag $publishedNotes
            if ($LASTEXITCODE -ne 0) {
              throw "The release notes could not be prepared for $tag."
            }
          }
          $nsis = Get-ChildItem "target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $msi = Get-ChildItem "target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $nsis -or -not $msi) {
            throw "The installer bundles were not produced."
          }

          # The raw executable backs the deferred self-replace path. It is published beside the
          # installers and signed separately, with the platform it was built for.
          $raw = "target/release/rigel-app.exe"
          if (-not (Test-Path $raw)) {
            throw "The release executable was not produced."
          }
          $bin = "Rigel_${version}_x64.exe"
          Copy-Item $raw $bin

          $env:RIGEL_UPDATE_VERSION = $version
          $env:RIGEL_UPDATE_URL = "https://github.com/${{ github.repository }}/releases/download/$tag/$($nsis.Name)"
          $env:RIGEL_UPDATE_SHA256 = (Get-FileHash $nsis.FullName -Algorithm SHA256).Hash.ToLower()
          $env:RIGEL_UPDATE_MSI_URL = "https://github.com/${{ github.repository }}/releases/download/$tag/$($msi.Name)"
          $env:RIGEL_UPDATE_MSI_SHA256 = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          $env:RIGEL_UPDATE_BIN_URL = "https://github.com/${{ github.repository }}/releases/download/$tag/$bin"
          $env:RIGEL_UPDATE_BIN_SHA256 = (Get-FileHash $bin -Algorithm SHA256).Hash.ToLower()
          $env:RIGEL_UPDATE_BIN_TARGET = "windows-x86_64"
          $env:RIGEL_UPDATE_NOTES = "Rigel $version"

          node scripts/sign-update-manifest.mjs latest.json

          # Prove the secret in this repository matches the public key in the build before the
          # release exists. A mismatch fails here, not after every installed copy asks.
          $env:RIGEL_UPDATE_PUBKEY = (Get-Content "crates/rigel-app/resources/update-pubkey.txt" -Raw).Trim()
          $verify = Join-Path $env:RUNNER_TEMP "update-verify"
          cargo run -q -p rigel-cli -- --data-dir $verify update enable
          cargo run -q -p rigel-cli -- --data-dir $verify update check --manifest latest.json
          cargo run -q -p rigel-cli -- --data-dir $verify update verify $nsis.FullName --manifest latest.json
          cargo run -q -p rigel-cli -- --data-dir $verify update verify $msi.FullName --manifest latest.json
          cargo run -q -p rigel-cli -- --data-dir $verify update verify $bin --manifest latest.json

          if (gh release view $tag 2>$null) {
            gh release upload $tag latest.json $nsis.FullName $msi.FullName $bin sbom.cdx.json --clobber
            if (Test-Path $publishedNotes) { gh release edit $tag --notes-file $publishedNotes }
          } else {
            $notesArgs = if (Test-Path $publishedNotes) { @("--notes-file", $publishedNotes) } else { @("--generate-notes") }
            # A pre-release must never become `releases/latest`: the updater's default feed reads
            # that URL, and stable installs must not be moved onto an alpha by publishing one.
            $channel = if ($version -match "-") { "--prerelease" } else { "--latest" }
            gh release create $tag latest.json $nsis.FullName $msi.FullName $bin sbom.cdx.json `
              --title "Rigel $version" @notesArgs $channel
          }
