[workspace]
resolver = "3"
members = [
    "crates/rigel-core",
    "crates/rigel-adapters",
    "crates/rigel-mcp",
    "crates/rigel-cli",
    "crates/rigel-app",
]

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chuckiphone/Rigel"

[workspace.dependencies]
age = "0.11"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
ed25519-dalek = { version = "2", features = ["std"] }
keyring = "3"
# SQLCipher is a build-time property of libsqlite3-sys, not a runtime switch: this feature
# unifies with sqlx-sqlite's `bundled` feature and makes the bundled SQLite an encrypted
# SQLCipher build. The vendored build uses SQLCipher's libtomcrypt provider, which keeps the
# build self-contained without requiring OpenSSL's Perl toolchain.
libsqlite3-sys = { version = "0.40", default-features = false, features = [
    "bundled-sqlcipher",
] }
futures = "0.3"
getrandom = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "json",
    "stream",
    "system-proxy",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "io-util",
    "io-std",
    "process",
    "fs",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.24"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

# SQLx 0.8.6 pins libsqlite3-sys to 0.30, whose bundled SQLite is affected by
# RUSTSEC-2026-0459. The vendored copy changes only that bound; remove it once a
# released SQLx allows libsqlite3-sys >= 0.40.
[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }
# The bundled SQLCipher build uses its libtomcrypt provider instead of OpenSSL. This keeps
# Windows builds working without a separate Perl/OpenSSL toolchain and works on every host.
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
